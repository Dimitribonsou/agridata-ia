<div class="w-full h-full flex flex-col bg-gray-50">
  @if (!hasSelection()) {
    <div class="flex-1 grid grid-cols-2 gap-4 p-6">
      <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col">
        <app-ai-gemini 
          [analysis]="currentAnalysis()"
        ></app-ai-gemini>
      </div>

      <div class="bg-white rounded-lg shadow overflow-hidden flex flex-col">
        <app-pdf-preview 
          [analysis]="currentAnalysis()"
        ></app-pdf-preview>
      </div>
    </div>

    <div class="border-t border-gray-200 bg-white p-6 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <p-button 
          label="" 
          icon="pi pi-arrow-left"
          severity="secondary"
          [disabled]="isFirstAnalysis()"
          (onClick)="onPreviousAnalysis()"
        ></p-button>
        <span class="text-sm font-semibold text-gray-700 px-4">{{ progressText() }}</span>
        <p-button 
          label="" 
          icon="pi pi-arrow-right"
          severity="secondary"
          [disabled]="isLastAnalysis()"
          (onClick)="onNextAnalysis()"
        ></p-button>
      </div>

      <div class="flex items-center gap-3">
        <p-button 
          label="Retour" 
          icon="pi pi-times"
          severity="secondary"
          (onClick)="onBackToDashboard()"
        ></p-button>
        <p-button 
          label="Télécharger le PDF" 
          icon="pi pi-download"
          severity="secondary"
          (onClick)="onDownloadPdf()"
        ></p-button>
        <p-button 
          label="Suivant : Configurer l'envoi" 
          icon="pi pi-arrow-right"
          (onClick)="onConfigureShipping()"
        ></p-button>
      </div>
    </div>
  } @else {
    <div class="flex items-center justify-center h-full">
      <div class="text-center">
        <i class="pi pi-inbox text-6xl text-gray-300 mb-4 block"></i>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Aucune sélection</h2>
        <p class="text-gray-500 mb-6">Retournez au tableau de bord pour sélectionner des analyses</p>
        <p-button 
          label="Retour au tableau de bord" 
          icon="pi pi-arrow-left"
          (onClick)="onBackToDashboard()"
        ></p-button>
      </div>
    </div>
  }
</div>
