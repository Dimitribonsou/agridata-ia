<div class="w-full h-full flex flex-col bg-white">
  @if (!hasSelection()) {
    <div class="flex flex-col h-full">
      <!-- Header Section -->
      <div class="border-b border-gray-200 bg-gray-50 px-8 py-6">
        <div class="flex items-center justify-between mb-2">
          <!-- <div>
            <h1 class="text-3xl font-bold text-gray-900">Analyse Laitière</h1>
            <p class="text-sm text-gray-600 mt-1">Rapport d'analyse et diagnostic IA</p>
          </div> -->
          <div class="flex items-center gap-4">
            @if (currentAnalysis()) {
              <div class="text-right">
                <p class="text-2xl font-bold text-gray-900">{{ currentAnalysis()!.producerName }}</p>
                <p class="text-sm text-gray-600 mt-1">{{ currentAnalysis()!.producerId }}</p>
              </div>
              <div 
                [class]="'px-4 py-2 rounded-lg font-semibold text-white ' + (currentAnalysis()!.status === 'ALERTE' ? 'bg-red-500' : 'bg-green-500')"
              >
                {{ currentAnalysis()!.status }}
              </div>
            }
          </div>
        </div>
      </div>

      <!-- Main Content: 50/50 Split Layout -->
      <div class="flex-1 flex overflow-hidden">
        <!-- Left Panel: AI Report -->
        <div class="flex-1 border-r border-gray-200 flex flex-col overflow-hidden bg-white">
          <app-ai-gemini 
            [analysis]="currentAnalysis()"
            class="flex-1 flex flex-col overflow-hidden"
          ></app-ai-gemini>
        </div>

        <!-- Right Panel: PDF Preview -->
        <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
          <app-pdf-preview 
            [analysis]="currentAnalysis()"
            class="flex-1 overflow-hidden"
          ></app-pdf-preview>
        </div>
      </div>

      <!-- Footer Navigation -->
      <div class="border-t border-gray-200 bg-white px-8 py-6">
        <div class="flex items-center justify-between">
          <!-- Navigation buttons -->
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
              <p-button 
                label="" 
                icon="pi pi-chevron-left"
                severity="secondary"
                [disabled]="isFirstAnalysis()"
                (onClick)="onPreviousAnalysis()"
              ></p-button>
              <span class="text-sm font-semibold text-gray-700 px-4 min-w-20 text-center">{{ progressText() }}</span>
              <p-button 
                label="" 
                icon="pi pi-chevron-right"
                severity="secondary"
                [disabled]="isLastAnalysis()"
                (onClick)="onNextAnalysis()"
              ></p-button>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="flex items-center gap-3">
            <p-button 
              label="Retour" 
              icon="pi pi-arrow-left"
              severity="secondary"
              outlined
              (onClick)="onBackToDashboard()"
            ></p-button>
            <p-button 
              label="Telecharger PDF" 
              icon="pi pi-download"
              severity="info"
              (onClick)="onDownloadPdf()"
            ></p-button>
            <p-button 
              label="Suivant: Configurer l'envoi" 
              icon="pi pi-arrow-right"
              severity="success"
              (onClick)="onConfigureShipping()"
            ></p-button>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="flex items-center justify-center h-full">
      <div class="text-center">
        <i class="pi pi-inbox text-6xl text-gray-300 mb-4 block"></i>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Aucune analyse selectionnee</h2>
        <p class="text-gray-500 mb-6">Retournez au tableau de bord pour selectionner des analyses a consulter</p>
        <p-button 
          label="Retour au tableau de bord" 
          icon="pi pi-arrow-left"
          (onClick)="onBackToDashboard()"
        ></p-button>
      </div>
    </div>
  }
</div>
