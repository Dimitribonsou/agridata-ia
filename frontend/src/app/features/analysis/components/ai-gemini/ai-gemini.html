<div class="h-full flex flex-col gap-4">
  @if (analysis(); as currentAnalysis) {
    <div>
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Analyse IA & Rapport</h2>
      <p class="text-sm text-gray-600">{{ currentAnalysis.producerName }}</p>
    </div>
  } @else {
    <div class="text-center text-gray-400 py-4">
      <p>Aucune analyse sélectionnée</p>
    </div>
  }

  <p-button
    label="Générer l'analyse IA"
    icon="pi pi-sparkles"
    (onClick)="onGenerateAnalysis()"
    [loading]="isLoading()"
    class="w-full"
  ></p-button>

  <p-divider></p-divider>

  <div class="flex-1 flex flex-col">
    <label class="text-sm font-semibold text-gray-700 mb-2">Rapport Éditable</label>
    <textarea
      pTextarea 
      [(ngModel)]="reportContent"
      [rows]="15"
      class="flex-1 p-4 border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-ld-blue"
      placeholder="Contenu du rapport..."
    ></textarea>
    <div class="text-xs text-gray-500 mt-2">
       Modifications en cours — validation en temps réel
    </div>
  </div>
</div>
