<div class="w-full">
  <h2 class="text-2xl ms-2 font-bold text-gray-900 mb-4">{{ title() }}</h2>
  <p-table
    [value]="data()"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['ID Producteur', 'Date de collecte','Statut']"
    [selection]="selectedItems()"
    (selectionChange)="onSelectionChange($event)"
    [tableStyle]="{ 'min-width': '50rem' }"
    responsiveLayout="scroll"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 3rem">
          <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
        </th>
        <th pSortableColumn="ID Producteur" class="font-semibold">Producteur <p-sortIcon field="ID Producteur"></p-sortIcon></th>
        <th pSortableColumn="Exploitation" class="font-semibold">Exploitation </th>
        <th pSortableColumn="Date de collecte" class="font-semibold">Date de collecte <p-sortIcon field="Date de collecte"></p-sortIcon></th>
        <th pSortableColumn="Matière Grasse (g/L)" class="font-semibold">Matière Grasse (g/L) </th>

        <th pSortableColumn="Cellules Somatiques" class="font-semibold">Cellules somatiques </th>
        <th pSortableColumn="Statut" class="font-semibold">Statut <p-sortIcon field="Statut"></p-sortIcon></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
      <tr>
        <td>
          <p-tableCheckbox [value]="row"></p-tableCheckbox>
        </td>
        <td>{{ row.producerId || 'N/A' }}</td>
        <td>{{ row.exploitation || 'N/A' }} </td> 
        <td>{{ row.sampleDate || 'N/A' }}</td>
        <td class="text-right">{{ row.metrics.fatRate  || 0 }}</td>
        <td class="text-right">{{ row.metrics.somaticCells  || 0 }}</td>
        <td>
          <p-tag
            [value]="row.status || 'unknown'"
            [severity]="row.status === 'COMFORME' ? 'success' : row.status === 'ALERTE' ? 'danger' : 'info'"
          ></p-tag>
        </td>
        
      </tr>
    </ng-template>
  </p-table>
</div>
